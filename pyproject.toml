[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batterylimit"
dynamic = ["version"]
description = "A background battery charging limiter that reminds you to plug in or unplug your charger."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "BatteryLimit contributors" }]
keywords = ["battery", "charging", "qt", "pyside6", "tray", "utility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
]

[project.scripts]
batterylimit = "batterylimit.main:main"

[project.gui-scripts]
batterylimit-gui = "batterylimit.main:main"

[tool.setuptools.dynamic]
version = { attr = "batterylimit.__version__" }

[tool.setuptools.packages.find]
include = ["batterylimit*"]

[tool.setuptools.package-data]
batterylimit = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["batterylimit"]
