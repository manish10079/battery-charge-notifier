[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-charge-notifier"
dynamic = ["version"]
description = "A tray utility that reminds you when to plug in or unplug your charger."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Battery Charge Notifier contributors" }]
keywords = [
    "battery",
    "charging",
    "charge-limit",
    "qt",
    "pyside6",
    "tray",
    "notification",
    "utility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "PySide6>=6.8",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.6",
]

[project.scripts]
battery-charge-notifier = "battery_charge_notifier.main:main"

[project.gui-scripts]
battery-charge-notifier-gui = "battery_charge_notifier.main:main"

[tool.setuptools.dynamic]
version = { attr = "battery_charge_notifier.__version__" }

[tool.setuptools.packages.find]
include = ["battery_charge_notifier*"]

[tool.setuptools.package-data]
battery_charge_notifier = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["battery_charge_notifier"]
